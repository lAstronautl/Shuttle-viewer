<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StarHorizon Render</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="mines.css">
</head>
<body class="game">
<header>
  <div id="top">
    <h1>StarHorizon Render</h1>
    <a class="btn" href="./">К каталогу</a>
  </div>
  <nav id="modes" aria-label="Режимы игры">
    <a href="game.html">Угадай карту</a>
    <a href="mines.html" class="on" aria-current="page">Сапёр</a>
    <a href="tile.html">Угадай тайл</a>
  </nav>
</header>

<main id="gm">
  <div class="row">
    <span class="lbl">Поле</span>
    <div class="seg" id="m-field">
      <button type="button" data-f="ship">Шаттл</button>
      <button type="button" data-f="poi">POI</button>
    </div>
  </div>

  <div class="row" id="m-map-row">
    <span class="lbl">Миникарта</span>
    <select id="m-map" aria-label="Какую миникарту использовать"></select>
  </div>

  <div class="row">
    <span class="lbl">Сложность</span>
    <div class="seg" id="m-preset">
      <button type="button" data-p="easy">Лёгкая</button>
      <button type="button" data-p="medium">Средняя</button>
      <button type="button" data-p="hard">Сложная</button>
      <button type="button" data-p="custom">Своё</button>
    </div>
  </div>

  <div class="row" id="m-custom-ship" hidden>
    <label>Мин, % клеток <input id="c-d" type="number" min="5" max="40"></label>
  </div>

  <div class="hud">
    <span>Мин осталось <b id="m-left">0</b></span>
    <span>Время <b id="m-time">0</b> с</span>
    <span id="m-best"></span>
    <span class="now"><button id="m-new" type="button" class="primary">Новая игра</button></span>
  </div>

  <div id="m-wrap"><div id="m-board" role="grid" aria-label="Игровое поле"></div></div>
  <p id="m-msg" class="note" aria-live="polite"></p>
  <p id="m-subject" class="note"></p>
</main>

<script src="mines.js"></script>
</body>
</html>
