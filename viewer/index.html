<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Shuttle Viewer: просмотр</title>
<link rel="icon" type="image/png" href="../icon.png">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<div id="stage"><img id="img" alt="" draggable="false"></div>
<div id="toolbar">
  <a href="../" title="К каталогу">&larr;</a>
  <button id="toggle" title="Список шаттлов">#</button>
  <button id="zin" title="Приблизить">+</button>
  <button id="zout" title="Отдалить">-</button>
  <button id="fit" title="Вписать в экран">[ ]</button>
  <span id="title"></span>
</div>
<div id="list" hidden></div>
<p id="hint">Колесо или + / -: масштаб. Перетаскивание, WASD, стрелки или HJKL: перемещение. Двойной клик: вписать в экран.</p>
<script src="viewer.js"></script>
</body>
</html>
