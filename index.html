<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StarHorizon Render</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div id="top">
    <h1>StarHorizon Render</h1>
    <div id="mode" role="group" aria-label="Что показывать на карточках">
      <button type="button" data-mode="render">Рендер</button>
      <button type="button" data-mode="mini">Миникарта</button>
    </div>
    <a id="all" href="shuttle-renders.zip" download>Скачать все (zip)</a>
  </div>
  <div id="filters">
    <input id="q" type="search" placeholder="Поиск по названию, описанию...">
    <select id="group"><option value="">Все верфи</option></select>
    <select id="category"><option value="">Любой размер</option></select>
    <details class="multi" id="cls"><summary>Любой класс</summary><div class="opts"></div></details>
    <details class="multi" id="engine"><summary>Любой двигатель</summary><div class="opts"></div></details>
    <label class="chk"><input id="custom" type="checkbox" checked> Верфь Custom</label>
    <input id="pmin" type="number" min="0" step="1000" inputmode="numeric" placeholder="Цена от">
    <input id="pmax" type="number" min="0" step="1000" inputmode="numeric" placeholder="Цена до">
    <select id="sort">
      <option value="price-asc">Цена по возрастанию</option>
      <option value="price-desc">Цена по убыванию</option>
      <option value="name">Название</option>
    </select>
  </div>
</header>
<main id="grid"></main>
<footer>Данные автоматически собираются из <a href="https://github.com/StarHorizon14/StarHorizon">StarHorizon14/StarHorizon</a>. Обновлено: <span id="updated">-</span></footer>
<script src="app.js"></script>
</body>
</html>
