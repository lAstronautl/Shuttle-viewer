<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuttle Viewer</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Shuttle Viewer <small id="count"></small></h1>
  <div id="filters">
    <input id="q" type="search" placeholder="Поиск по названию, описанию…">
    <select id="group"><option value="">Все магазины</option></select>
    <select id="category"><option value="">Любой размер</option></select>
    <select id="cls"><option value="">Любой класс</option></select>
    <select id="engine"><option value="">Любое топливо/двигатель</option></select>
    <button id="dl" type="button" title="Скачать рендеры найденных шаттлов в zip с их названиями">Скачать zip</button>
    <button id="clear" type="button" hidden>Снять выбор</button>
    <select id="sort">
      <option value="price-asc">Цена ↑</option>
      <option value="price-desc">Цена ↓</option>
      <option value="name">Название</option>
    </select>
  </div>
</header>
<main id="grid"></main>
<div id="view" hidden></div>
<footer><a href="viewer/">Просмотрщик карт</a> · <a href="shuttle-renders.zip">Все рендеры (zip)</a> · Данные автоматически собираются из <a href="https://github.com/StarHorizon14/StarHorizon">StarHorizon14/StarHorizon</a>. Обновлено: <span id="updated">—</span></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
