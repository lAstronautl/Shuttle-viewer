<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StarHorizon Render</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div id="top">
    <h1>StarHorizon Render</h1>
    <div id="mode" role="group" aria-label="Что показывать на карточках">
      <button type="button" data-mode="render">Рендер</button>
      <button type="button" data-mode="mini">Миникарта</button>
    </div>
    <a id="all" href="shuttle-renders.zip" download>Скачать все (zip)</a>
  </div>
  <div id="filters">
    <input id="q" type="search" placeholder="Поиск по названию, описанию...">
    <details class="multi" id="group"><summary>Все верфи</summary><div class="opts"></div></details>
    <select id="category"><option value="">Любой размер</option></select>
    <details class="multi" id="cls"><summary>Любой класс</summary><div class="opts"></div></details>
    <details class="multi" id="engine"><summary>Любой двигатель</summary><div class="opts"></div></details>
    <details class="multi" id="price">
      <summary>Цена</summary>
      <div class="panel">
        <div class="seg" role="group" aria-label="Сортировка по цене">
          <button id="sortasc" type="button" data-sort="asc">По возрастанию</button>
          <button id="sortdesc" type="button" data-sort="desc">По убыванию</button>
        </div>
        <div class="range">
          <input id="rlo" type="range" aria-label="Цена от">
          <input id="rhi" type="range" aria-label="Цена до">
        </div>
        <div class="nums">
          <input id="pmin" type="number" min="0" inputmode="numeric" aria-label="Цена от">
          <span>-</span>
          <input id="pmax" type="number" min="0" inputmode="numeric" aria-label="Цена до">
        </div>
        <button id="preset" type="button">Сбросить</button>
      </div>
    </details>
  </div>
</header>
<main id="grid"></main>
<footer>Данные автоматически собираются из <a href="https://github.com/StarHorizon14/StarHorizon">StarHorizon14/StarHorizon</a>. Обновлено: <span id="updated">-</span></footer>
<script src="app.js"></script>
</body>
</html>
