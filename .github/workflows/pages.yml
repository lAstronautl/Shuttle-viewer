name: Build & deploy site

# Fast job (a few minutes): builds the site and deploys it to GitHub Pages.
# Uses the latest successful `Render shuttles` run for the full shuttle renders,
# so a push only rebuilds and redeploys the site; shuttles are never re-rendered here (see render.yml).

on:
  push:
    branches: [master, main]
  workflow_run:
    workflows: ["Render shuttles"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # download the renders artifact
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch StarHorizon (only prototypes and the maps)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/StarHorizon14/StarHorizon.git ../StarHorizon
          git -C ../StarHorizon sparse-checkout set Resources/Prototypes Resources/Maps Resources/Locale

      - name: Generate shuttles.json from vessel prototypes
        run: python scripts/build_shuttles.py ../StarHorizon .

      - name: Download shuttle renders (latest successful render run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p render-cache
          run_id=$(gh run list --workflow render.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name shuttle-renders --dir render-cache || echo "::warning::could not download renders"
          else
            echo "::warning::no successful render run yet; run 'Render shuttles' first for full renders"
          fi
      - run: python scripts/attach_renders.py render-cache .

      - name: Build starhorizon-map-render (mini maps)
        run: |
          git clone --depth 1 https://github.com/lAstronautl/starhorizon-map-render.git ../starhorizon-map-render
          cd ../starhorizon-map-render
          npm ci
          npm run build --workspace=renderer
      - name: Render mini maps
        run: python scripts/render_minimaps.py ../StarHorizon ../starhorizon-map-render .

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css app.js game.html game.css game.js mines.html mines.css mines.js icon.png shuttles.json shuttles viewer _site/
          python scripts/viewer_shuttles.py _site
          python scripts/export_renders.py render-cache _site/shuttle-renders.zip --minimaps . || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
