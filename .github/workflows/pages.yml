name: Build & deploy to GitHub Pages

on:
  schedule:
    - cron: "0 4 * * 1,5" # twice a week (Mon, Fri 04:00 UTC): refresh from StarHorizon and keep the render cache alive
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # the first run renders every shuttle and takes long

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Fetch StarHorizon (with RobustToolbox submodules)
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/StarHorizon14/StarHorizon.git ../StarHorizon

      - name: Build Content.MapRenderer
        working-directory: ../StarHorizon
        run: dotnet build Content.MapRenderer -c Release

      - name: Generate shuttles.json from vessel prototypes
        run: python scripts/build_shuttles.py ../StarHorizon .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build starhorizon-map-render (mini maps)
        run: |
          git clone --depth 1 https://github.com/lAstronautl/starhorizon-map-render.git ../starhorizon-map-render
          cd ../starhorizon-map-render
          npm ci
          npm run build --workspace=renderer
      - name: Render mini maps
        run: python scripts/render_minimaps.py ../StarHorizon ../starhorizon-map-render .

      # Renders are cached by the sha1 of each shuttle map file, so only new/changed shuttles get rendered.
      - name: Restore render cache
        uses: actions/cache/restore@v4
        with:
          path: render-cache
          key: renders-${{ github.run_id }}
          restore-keys: renders-

      - name: Render shuttles with Content.MapRenderer
        run: python scripts/render_shuttles.py ../StarHorizon render-cache .

      - name: Save render cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: render-cache
          key: renders-${{ github.run_id }}

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css app.js icon.png shuttles.json shuttles _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
